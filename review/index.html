<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review - GC Face Painting</title>
    <meta name="description" content="Had GC Face Painting at your party? Share your experience with a review on Google or Facebook.">
    <link rel="canonical" href="https://gcfacepainting.com.au/review/">
    <meta property="og:title" content="Leave a Review - GC Face Painting">
    <meta property="og:description" content="Thank you for inviting me to your celebration! Share your experience on Google or Facebook.">
    <meta property="og:url" content="https://gcfacepainting.com.au/review/">
    <meta property="og:type" content="website">
    <link href="https://bootswatch.com/5/quartz/bootstrap.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/logo_squared_256.png">
    <style>
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #e8328399 0%, #5e62b099 50%, #33b7e299 100%);
            color: white;
        }

        .navbar-brand img {
            height: 35px;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 48px 20px;
        }

        .review-card {
            width: 100%;
            max-width: 560px;
            padding: clamp(28px, 6vw, 48px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: rgba(32, 29, 59, 0.88);
            box-shadow: 0 16px 48px rgba(32, 29, 59, 0.2);
        }

        .review-intro {
            color: #e4dff0;
            line-height: 1.7;
        }

        .review-links {
            display: grid;
            gap: 16px;
            margin: 28px 0 24px;
        }

        .review-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border: 1px solid transparent;
            border-radius: 14px;
            text-align: left;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .icon {
            width: 1em;
            height: 1em;
            flex-shrink: 0;
            fill: currentColor;
            vertical-align: -0.125em;
        }

        .platform-icon {
            width: 28px;
            height: 28px;
        }

        .google-link,
        .google-link:hover {
            background: #fff;
            color: #252333;
        }

        .google-link .platform-icon {
            color: #4285f4;
        }

        .facebook-link,
        .facebook-link:hover {
            background: #0866ff;
            color: #fff;
        }

        .review-link:hover {
            border-color: #fecfef;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        a:focus-visible {
            outline: 3px solid #fecfef;
            outline-offset: 5px;
        }

        .review-note {
            color: #cfc7df;
            font-size: 0.9rem;
        }

        footer {
            padding: 0 20px 28px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-primary" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand" href="/" aria-label="GC Face Painting home">
                    <img src="/img/logo_256.png" alt="GC Face Painting" class="d-inline-block align-text-top">
                </a>
                <a href="/" class="text-white text-decoration-none small">
                    <svg class="icon me-1" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                    </svg>Back to website
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="review-card text-center" aria-labelledby="review-heading">
            <h1 id="review-heading" class="fw-bold mb-3">How was your party?</h1>
            <p class="review-intro mb-0">
                Thanks for having me! I'd love to hear about your experience.
            </p>

            <div class="review-links">
                <a class="review-link google-link" href="https://www.google.com/searchviewer/10?client=ms-android-google&amp;hs=620q&amp;sca_esv=7ebfee73c6d9f925&amp;biw=426&amp;bih=804&amp;output=search&amp;svid=CCYSESoPCg0vZy8xMXloc2p5eHBjGAo&amp;sa=X&amp;ved=2ahUKEwjY75Hil46YAxWZwjgGHTgADqkQ1t4PegUIhAEQBA" target="_blank" rel="noopener noreferrer">
                    <svg class="icon platform-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"/>
                    </svg>
                    <span>Review on Google</span>
                    <svg class="icon ms-auto small" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/>
                        <path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/>
                    </svg>
                    <span class="visually-hidden">(opens in a new tab)</span>
                </a>
                <a class="review-link facebook-link" href="https://www.facebook.com/profile.php?id=61579527562247" target="_blank" rel="noopener noreferrer">
                    <svg class="icon platform-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                    </svg>
                    <span>Review on Facebook</span>
                    <svg class="icon ms-auto small" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/>
                        <path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/>
                    </svg>
                    <span class="visually-hidden">(opens in a new tab)</span>
                </a>
            </div>

            <p class="review-note mb-4">Choose either platform. You may need to sign in.</p>
            <p class="fst-italic mb-0">Joelle x</p>
        </section>
    </main>

    <footer>
        <small>GC Face Painting</small>
    </footer>
</body>
</html>
